<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Vitaflex</title>
  <meta name="description" content="Log in to your Vitaflex account to access personalised workout plans and the shop." />
  <link rel="shortcut icon" href="https://buvi07.neocities.org/image/shopping%20(1).webp" type="image/x-icon" />
  <!-- tailwind css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-gradient-to-b from-indigo-950 via-blue-900 to-cyan-800 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header (identical to index2.html) -->
  <header class="flex justify-between items-center p-5 bg-indigo-950 sticky top-0 z-50 shadow-md">
    <a href="index2.html"><h1 class="text-2xl font-bold text-amber-400">Vitaflex</h1></a>
    <nav class="hidden md:flex gap-6">
      <a href="index2.html#home"    class="hover:text-amber-400 hover:underline">Home</a>
      <a href="index2.html#workout" class="hover:text-amber-400 hover:underline">Workouts</a>
      <a href="index2.html#plan"    class="hover:text-amber-400 hover:underline">Plans</a>
      <a href="index2.html#contact" class="hover:text-amber-400 hover:underline">Contact</a>
      <a href="register.html"       class="hover:text-amber-400 hover:underline">Register</a>
    </nav>
    <div class="md:hidden">
      <i class="fa-solid fa-bars text-amber-400"></i>
    </div>
  </header>

  <!-- Login Form -->
  <main class="flex-1 flex items-center justify-center py-20 px-6">
    <div class="bg-indigo-800 rounded-xl shadow-lg p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold text-amber-400 mb-6 text-center">Login</h2>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label for="login-email" class="block text-sm font-semibold text-cyan-300 mb-1">Email</label>
          <input
            id="login-email"
            type="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
            class="w-full px-4 py-2 rounded bg-indigo-900 border border-blue-700 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400"
          />
        </div>

        <div class="mb-6">
          <label for="login-password" class="block text-sm font-semibold text-cyan-300 mb-1">Password</label>
          <input
            id="login-password"
            type="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            class="w-full px-4 py-2 rounded bg-indigo-900 border border-blue-700 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400"
          />
        </div>

        <button
          id="login-submit"
          type="submit"
          class="w-full py-3 bg-amber-400 text-indigo-950 font-bold rounded-full hover:bg-amber-500 hover:scale-105 transition">
          Login
        </button>

        <p id="login-error" class="mt-4 text-red-400 text-sm text-center hidden"></p>
      </form>

      <p class="mt-6 text-center text-gray-300 text-sm">
        Don't have an account?
        <a href="register.html" class="text-amber-400 hover:underline font-semibold">Register</a>
      </p>
    </div>
  </main>

  <!-- Footer (identical to index2.html) -->
  <footer class="bg-indigo-950 text-center py-6 text-gray-400">
    <p>&copy; 2025 Vitaflex. All rights reserved.</p>
  </footer>

  <script type="module">
    import { api }         from './js/api.js';
    import { saveSession, isLoggedIn } from './js/auth.js';

    // If already logged in, redirect
    if (isLoggedIn()) window.location.href = 'index2.html';

    const form      = document.getElementById('login-form');
    const errorEl   = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      submitBtn.disabled    = true;
      submitBtn.textContent = 'Logging in…';

      try {
        const { token, user } = await api.auth.login({
          email:    document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value
        });
        saveSession(token, user);

        // Redirect to page requested before login, or home
        const params   = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'index2.html';
        window.location.href = redirect;
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.textContent = 'Login';
        submitBtn.disabled    = false;
      }
    });
  </script>
</body>

</html>

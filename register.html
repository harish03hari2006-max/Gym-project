<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Vitaflex</title>
  <meta name="description" content="Create your free Vitaflex account and start your fitness journey today." />
  <link rel="shortcut icon" href="https://buvi07.neocities.org/image/shopping%20(1).webp" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-gradient-to-b from-indigo-950 via-blue-900 to-cyan-800 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="flex justify-between items-center p-5 bg-indigo-950 sticky top-0 z-50 shadow-md">
    <a href="index2.html"><h1 class="text-2xl font-bold text-amber-400">Vitaflex</h1></a>
    <nav class="hidden md:flex gap-6">
      <a href="index2.html#home"    class="hover:text-amber-400 hover:underline">Home</a>
      <a href="index2.html#workout" class="hover:text-amber-400 hover:underline">Workouts</a>
      <a href="index2.html#plan"    class="hover:text-amber-400 hover:underline">Plans</a>
      <a href="index2.html#contact" class="hover:text-amber-400 hover:underline">Contact</a>
      <a href="login.html"          class="hover:text-amber-400 hover:underline">Login</a>
    </nav>
    <div class="md:hidden">
      <i class="fa-solid fa-bars text-amber-400"></i>
    </div>
  </header>

  <!-- Register Form -->
  <main class="flex-1 flex items-center justify-center py-20 px-6">
    <div class="bg-indigo-800 rounded-xl shadow-lg p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold text-amber-400 mb-6 text-center">Create Account</h2>

      <form id="register-form" novalidate>
        <div class="mb-4">
          <label for="reg-name" class="block text-sm font-semibold text-cyan-300 mb-1">Full Name</label>
          <input
            id="reg-name"
            type="text"
            placeholder="John Doe"
            required
            autocomplete="name"
            class="w-full px-4 py-2 rounded bg-indigo-900 border border-blue-700 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400"
          />
        </div>

        <div class="mb-4">
          <label for="reg-email" class="block text-sm font-semibold text-cyan-300 mb-1">Email</label>
          <input
            id="reg-email"
            type="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
            class="w-full px-4 py-2 rounded bg-indigo-900 border border-blue-700 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400"
          />
        </div>

        <div class="mb-6">
          <label for="reg-password" class="block text-sm font-semibold text-cyan-300 mb-1">Password <span class="text-gray-400 font-normal">(min 6 chars)</span></label>
          <input
            id="reg-password"
            type="password"
            placeholder="••••••••"
            required
            minlength="6"
            autocomplete="new-password"
            class="w-full px-4 py-2 rounded bg-indigo-900 border border-blue-700 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400"
          />
        </div>

        <button
          id="reg-submit"
          type="submit"
          class="w-full py-3 bg-amber-400 text-indigo-950 font-bold rounded-full hover:bg-amber-500 hover:scale-105 transition">
          Register
        </button>

        <p id="reg-error"   class="mt-4 text-red-400   text-sm text-center hidden"></p>
        <p id="reg-success" class="mt-4 text-cyan-300  text-sm text-center hidden"></p>
      </form>

      <p class="mt-6 text-center text-gray-300 text-sm">
        Already have an account?
        <a href="login.html" class="text-amber-400 hover:underline font-semibold">Login</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-950 text-center py-6 text-gray-400">
    <p>&copy; 2025 Vitaflex. All rights reserved.</p>
  </footer>

  <script type="module">
    import { api }                   from './js/api.js';
    import { saveSession, isLoggedIn } from './js/auth.js';

    if (isLoggedIn()) window.location.href = 'index2.html';

    const form       = document.getElementById('register-form');
    const errorEl    = document.getElementById('reg-error');
    const successEl  = document.getElementById('reg-success');
    const submitBtn  = document.getElementById('reg-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');
      submitBtn.disabled    = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const { token, user } = await api.auth.register({
          name:     document.getElementById('reg-name').value.trim(),
          email:    document.getElementById('reg-email').value.trim(),
          password: document.getElementById('reg-password').value
        });
        saveSession(token, user);
        successEl.textContent = `✅ Welcome, ${user.name}! Redirecting…`;
        successEl.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'index2.html'; }, 1200);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.textContent = 'Register';
        submitBtn.disabled    = false;
      }
    });
  </script>
</body>

</html>
